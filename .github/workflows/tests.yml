name: Tests

# This workflow is established in advance of the test suite itself. It is
# triggered on every push and on every pull request directed at main, and
# comprises two independent jobs: one for the Python backend and one for the
# JavaScript frontend. Each job may be extended once the corresponding test
# suite exists; no test has yet been written, so both currently tolerate an
# absence of test files rather than failing outright.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        # Executed in parallel via pytest-xdist ("-n auto" selects a worker
        # count according to the number of available CPUs; pytest-xdist must
        # be added to the dev dependency group in pyproject.toml).
        # --no-tests-are-collected is exit code 5; this is tolerated until
        # the test suite is populated, at which point this line should be
        # removed so that a genuinely empty suite is once again treated as
        # a failure.
        # The `|| exit-5` tolerance is gone as of 2026-09-16: there are now 76
        # tests, so an empty suite once again means something is wrong.
        run: pytest -n auto

  frontend-tests:
    name: Frontend (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Enabled 2026-09-16: frontend/package-lock.json now exists, created by
          # the first runtime dependencies (leaflet, leaflet-velocity, uplot).
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci, not npm install: it installs exactly the lock file and fails
        # if package.json and the lock have drifted, which is what CI is for.
        run: npm ci

      - name: Run tests
        # Vitest, added 2026-09-16 with the layer system. 36 tests, no DOM --
        # the geodesy was split into src/geo.js precisely so it imports nothing
        # and can be tested without one.
        run: npm test

      - name: Build
        # A passing test suite over a site that does not build is not a green
        # build. This is the step that would have caught a broken import.
        run: npm run build

  browser-tests:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    # NON-BLOCKING, ON PURPOSE, AND THIS IS MEANT TO BE REMOVED.
    #
    # A required check gates BOTH of us, and this suite was written by one of
    # us. Until it has run over enough pull requests to show it is not flaky,
    # a failure here should be read and not obeyed -- being blocked by a
    # browser suite you did not write, on a failure mode you have no reason to
    # know, is how a check gets routed around rather than fixed.
    #
    # Delete this line once it has been stable for a few PRs AND both of us
    # have agreed, per docs/good_pr_etiquette.md. Leaving it forever is the
    # failure mode in the other direction: a check nobody has to pass is a
    # check nobody reads.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache the browser
        # ~400 MB that never changes between runs for a pinned Playwright. The
        # key carries the version, so a version bump misses the cache once and
        # then keeps the new browser -- which is what makes the exact pin in
        # package.json worth having rather than a caret range.
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.59.1

      - name: Install Chromium
        # `--with-deps` installs the system libraries a headless browser needs
        # on a bare runner; the browser binary itself comes from the cache
        # above when it hits.
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        # Builds and previews the site itself, via `webServer` in
        # playwright.config.js. Entirely offline: every archive request is
        # answered from tests/e2e/fixtures/, and the build points at an
        # unroutable host so that anything unintercepted fails loudly.
        run: npm run test:e2e

      - name: Keep the failure screenshots
        # Only on failure, and only for a week. The whole point of this suite
        # is failures that are visible rather than described, so when one
        # happens the picture should outlive the log.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: frontend/test-results/
          retention-days: 7
