name: Tests

# This workflow is established in advance of the test suite itself. It is
# triggered on every push and on every pull request directed at main, and
# comprises two independent jobs: one for the Python backend and one for the
# JavaScript frontend. Each job may be extended once the corresponding test
# suite exists; no test has yet been written, so both currently tolerate an
# absence of test files rather than failing outright.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pytest
        # Executed in parallel via pytest-xdist ("-n auto" selects a worker
        # count according to the number of available CPUs; pytest-xdist must
        # be added to the dev dependency group in pyproject.toml).
        # --no-tests-are-collected is exit code 5; this is tolerated until
        # the test suite is populated, at which point this line should be
        # removed so that a genuinely empty suite is once again treated as
        # a failure.
        # The `|| exit-5` tolerance is gone as of 2026-09-16: there are now 76
        # tests, so an empty suite once again means something is wrong.
        run: pytest -n auto

  frontend-tests:
    name: Frontend (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Enabled 2026-09-16: frontend/package-lock.json now exists, created by
          # the first runtime dependencies (leaflet, leaflet-velocity, uplot).
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci, not npm install: it installs exactly the lock file and fails
        # if package.json and the lock have drifted, which is what CI is for.
        run: npm ci

      - name: Run tests
        # Vitest, added 2026-09-16 with the layer system. 36 tests, no DOM --
        # the geodesy was split into src/geo.js precisely so it imports nothing
        # and can be tested without one.
        run: npm test

      - name: Build
        # A passing test suite over a site that does not build is not a green
        # build. This is the step that would have caught a broken import.
        run: npm run build
