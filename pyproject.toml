[project]
name = "sar"
version = "0.1.0"
description = "Maritime search and rescue drift prediction: backend"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.3",
    "xarray==2026.7.0",
    "netCDF4==1.7.4",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "zarr==3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
