[project]
name = "sar"
version = "0.1.0"
description = "Maritime search and rescue drift prediction: backend"
requires-python = ">=3.10"
dependencies = [
    # "numpy",
    # "xarray",
    # "netCDF4",
    # "pandas",
    # "pyarrow",
    # "zarr",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
