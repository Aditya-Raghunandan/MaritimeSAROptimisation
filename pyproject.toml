[project]
name = "sar"
version = "0.1.0"
description = "Maritime search and rescue drift prediction: backend"
requires-python = ">=3.11"
dependencies = [
    # Verified 2026-09-10 against a real ARCO-ERA5 pull (13.7 MB, 192 hourly
    # steps) and a real NOAA GDP pull (926,533 observations). These are the
    # versions that produced that data, not a guess at what should work.
    "xarray==2026.7.0",
    "zarr==3.3.0",
    "gcsfs==2026.8.0",      # anonymous access to ARCO-ERA5 on Google Cloud
    "fsspec==2026.7.0",
    "netcdf4==1.7.4",
    "cftime==1.6.5",
    "dask==2026.8.0",       # scheduler="threads" is what makes the ARCO pull tractable
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",      # derived-tier Parquet
    "scipy==1.18.1",
    "matplotlib==3.11.1",
    "erddapy==3.3.0",       # NOAA GDP drifters
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 100
